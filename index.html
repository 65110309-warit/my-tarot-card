    <style>
        /* จัดรูปแบบพื้นหลังและกล่องใส่ตัวเลข */
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; font-size: 16px; width: 200px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }

        /* =========================================
           ส่วนของหน้าต่าง Popup ที่จะเด้งขึ้นมาซ้อนทับ
           ========================================= */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); 
        }

        /* กล่องเนื้อหาไพ่ที่อยู่ตรงกลาง Popup */
        .modal-content {
            background-color: white;
            margin: 10% auto; 
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 350px;
            text-align: center;
            position: relative;
            animation: popIn 0.4s ease-out; 
        }

        /* สร้างเอฟเฟกต์ให้กล่องค่อยๆ ซูมเด้งขึ้นมา */
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ปุ่ม (X) สำหรับกดปิด Popup */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #888;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover { color: #000; }

        /* ปรับขนาดรูปไพ่ใน Popup */
        .modal-content img { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        /* ปรับสีให้คำทำนายเด่นขึ้น */
        #modalText { color: #c88100; font-weight: bold; font-size: 16px; margin: 10px 0;}
        #modalDescription { color: #444; font-size: 14px; line-height: 1.5;}
    </style>
</head>

    function checkEnter(event) {

    function showPopup() {
        const num = document.getElementById("luckyNumber").value;
        const modal = document.getElementById("cardModal");
        
        if (cardDatabase[num]) {
            // เพิ่มการดึงข้อมูลทั้ง 3 ส่วนมาแสดง
            document.getElementById("modalTitle").innerText = cardDatabase[num].name;
            document.getElementById("modalText").innerText = cardDatabase[num].text;
            document.getElementById("modalDescription").innerText = cardDatabase[num].description;
            
            document.getElementById("modalImage").innerHTML = `<img src="${cardDatabase[num].img}" alt="ไพ่ทำนาย">`;
            
            modal.style.display = "block";
            document.getElementById("luckyNumber").value = "";
        } else {
            // ปรับข้อความเตือนให้สอดคล้องกับเลข 1-28
            alert("ไม่พบหมายเลขนี้ กรุณาลองใหม่ครับ (ลองพิมพ์เลขระหว่าง 1 ถึง 28)");
        }
    }

    function closeModal() {
        document.getElementById("cardModal").style.display = "none";
